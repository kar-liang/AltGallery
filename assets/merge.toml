# altgen merge config for AltGallery.
# Run: uvx altgen merge -c assets/merge.toml apps/PiliPlus/apps.json
# (append more apps/<AppName>/apps.json inputs as they are generated)
#
# Merge mode only reads [source] (root source metadata) and [output];
# the apps and news entries are extracted from the input apps.json files.
# Build-mode tables ([github], [app], [versions], [news]) are rejected.
# Root values also work as CLI flags, e.g. altgen merge --name ... apps/PiliPlus/apps.json

[source]
name = "AltGallery"
subtitle = "自用精选 iOS 侧载源"
description = "Curated AltStore/SideStore source built from GitHub Releases"
icon_url = "https://raw.githubusercontent.com/kar-liang/AltGallery/refs/heads/master/assets/icon.png"
website = "https://github.com/kar-liang/AltGallery"
tint_color = "#3B82F6"

[output]
path = "../all-apps.json"   # resolved against THIS file's directory -> repo root all-apps.json
